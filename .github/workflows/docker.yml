name: Docker

# Builds and publishes the multi-arch app image for the two long-lived branches.
# The Pi pulls these images (see deploy.sh); nothing is built on the Pi anymore.
# Separate workflow from ci.yml: this one needs packages: write, ci.yml stays
# read-only, and PR feedback latency is unaffected by the multi-arch build.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # GHCR requires a lowercase name; the owner is "Bennett5143", so deriving it
  # from github.repository would break — hardcoded on purpose.
  IMAGE: ghcr.io/bennett5143/ipad-dashboard

jobs:
  build-push:
    name: Build & Push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # QEMU is only needed for the runtime stage's RUN steps under arm64;
      # the .NET build stage cross-compiles natively on the amd64 runner
      # (see Dockerfile: --platform=$BUILDPLATFORM + -a $TARGETARCH).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Branch tag (main/dev) is what compose pulls; the full-sha tag is the
      # immutable rollback handle deploy.sh records. No latest tag on purpose.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=long

      # SBOM (SPDX, via Syft) and provenance are pushed as per-platform
      # attestation manifests; docker pull on the Pi ignores them. Inspect with:
      # docker buildx imagetools inspect $IMAGE:<tag> --format '{{ json .SBOM }}'
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
