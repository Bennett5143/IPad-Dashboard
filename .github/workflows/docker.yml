name: Docker

# Builds and publishes the multi-arch app image for the two long-lived branches.
# The Pi pulls these images (see deploy.sh); nothing is built on the Pi anymore.
# Separate workflow from ci.yml: this one needs packages: write, ci.yml stays
# read-only, and PR feedback latency is unaffected by the multi-arch build.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read-only at the top level, packages: write only on the job.
permissions:
  contents: read

env:
  # GHCR requires a lowercase name; the owner is "Bennett5143", so deriving it
  # from github.repository would break — hardcoded on purpose.
  IMAGE: ghcr.io/bennett5143/ipad-dashboard

jobs:
  build-push:
    name: Build & Push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No git operations after checkout; the build context excludes .git.
          persist-credentials: false

      # QEMU is only needed for the runtime stage's RUN steps under arm64;
      # the .NET build stage cross-compiles natively on the amd64 runner
      # (see Dockerfile: --platform=$BUILDPLATFORM + -a $TARGETARCH).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Branch tag (main/dev) is what compose pulls; the full-sha tag is the
      # immutable rollback handle deploy.sh records. No latest tag on purpose.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=long

      # SBOM (SPDX, via Syft) and provenance are pushed as per-platform
      # attestation manifests; docker pull on the Pi ignores them. Inspect with:
      # docker buildx imagetools inspect $IMAGE:<tag> --format '{{ json .SBOM }}'
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
