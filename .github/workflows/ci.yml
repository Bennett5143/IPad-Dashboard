name: CI

# Feature-Branches laufen über ihren PR (pull_request); ein zusätzlicher push-Trigger
# auf '**' würde build-test pro PR doppelt starten. Daher push nur auf die beiden
# langlebigen Branches (Post-Merge-Validierung); die PR-Läufe decken die
# Feature-Branches ab.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Alte Pipelines für denselben PR/Ref abbrechen, wenn ein neuer Push kommt.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least Privilege: Workflow braucht nur Lesezugriff aufs Repo.
permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      # NuGet-Cache. Key bindet sich an einen Hash aller .csproj –
      # solange keine Abhängigkeit geändert wird, kommt der Cache zum Einsatz.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # --collect "XPlat Code Coverage" aktiviert coverlet.collector
      # und erzeugt pro Test-Projekt eine coverage.cobertura.xml.
      - name: Test
        run: |
          dotnet test --configuration Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --verbosity normal

      # ReportGenerator macht aus den Cobertura-XMLs eine Markdown-Summary,
      # die via $GITHUB_STEP_SUMMARY in der Workflow-Übersicht erscheint
      # (und damit auch via `gh run view` in der Konsole).
      # if: always() sorgt dafür, dass die Summary auch bei roten Tests entsteht.
      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"MarkdownSummaryGithub;HtmlInline"
          cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      # Optional: Coverage-Reports als Artifact zum Download bereitstellen
      # (HTML-Variante zum lokalen Öffnen, XML für Tools wie VS Code-Extensions).
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: |
            coverage/**/coverage.cobertura.xml
            coverage-report/
          retention-days: 14

      # Upload to Codecov (badge + informational PR comments, see codecov.yml).
      # fail_ci_if_error: false — a Codecov outage must never redden the pipeline.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage/**/coverage.cobertura.xml
          flags: unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # Format-Check am Ende: schnell und unabhängig vom Build-Erfolg.
      # --verify-no-changes ist der Lint-Modus.
      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      # NuGetAudit visibility (advisory only, never fails the job): lists
      # packages with known advisories, incl. transitive ones — see
      # NuGetAuditMode in Directory.Build.props.
      - name: Vulnerable packages summary
        if: always()
        run: |
          echo "## Vulnerable NuGet packages" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          dotnet list package --vulnerable --include-transitive >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # Rehearses every EF migration against the production PostGIS image before a
  # change can reach a deployable branch — migrations used to run for the first
  # time live on the Pi. Also fails when the model drifted without a migration.
  migrations-smoke:
    name: Migrations smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: imresamu/postgis:16-3.5
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
          POSTGRES_DB: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard -d dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=dashboard;Username=dashboard;Password=dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      # dotnet-ef is a local tool; the manifest lives in src/.
      - name: Restore EF tool
        working-directory: src
        run: dotnet tool restore

      - name: Apply all migrations to an empty PostGIS
        working-directory: src
        run: >-
          dotnet ef database update
          --context DashboardDbContext
          --project Dashboard.Infrastructure
          --startup-project Dashboard.Web

      - name: Fail on model drift without a migration
        working-directory: src
        run: >-
          dotnet ef migrations has-pending-model-changes
          --context DashboardDbContext
          --project Dashboard.Infrastructure
          --startup-project Dashboard.Web

  # Repository/store tests against real PostGIS via Testcontainers. Opt-in by
  # design: without RUN_INTEGRATION_TESTS=1 these tests are skipped, so the
  # default local `dotnet test` stays Docker-free (see IntegrationFactAttribute).
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    env:
      RUN_INTEGRATION_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Run integration tests
        run: |
          dotnet test --configuration Release --no-restore \
            --filter "Category=Integration" \
            --verbosity normal

  # Generates a CycloneDX SBOM of the app's NuGet dependency graph (direct +
  # transitive). Scoped to Dashboard.Web: its project.assets.json holds the full
  # package closure via the project references, and test-only dependencies stay
  # out. The image-level SPDX SBOM is attached as a registry attestation by
  # docker.yml instead — this artifact is the human-downloadable counterpart.
  sbom:
    name: SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      # CycloneDX is a local tool like dotnet-ef; the manifest lives in src/.
      - name: Restore tools
        working-directory: src
        run: dotnet tool restore

      - name: Generate CycloneDX SBOM
        working-directory: src
        run: >-
          dotnet dotnet-CycloneDX Dashboard.Web/Dashboard.Web.csproj
          -o ../sbom -fn sbom.cyclonedx.json -F Json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom/sbom.cyclonedx.json
          retention-days: 30