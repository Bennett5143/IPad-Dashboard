name: Scorecard

# OpenSSF Scorecard: automated supply-chain security posture assessment
# (token permissions, action pinning, branch protection, ...). Advisory only;
# findings land in Security → Code scanning, the score is published (public
# repo). Based on the official ossf/scorecard-action template.
on:
  schedule:
    - cron: '30 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Required by upload-sarif and for publishing results.
      security-events: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
