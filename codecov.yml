# Codecov configuration — https://docs.codecov.com/docs/codecov-yaml
# Coverage is informational by design: it never fails CI or blocks a merge.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, flags"
  behavior: default
  require_changes: true
