# Codecov configuration — https://docs.codecov.com/docs/codecov-yaml
# Coverage is informational by design: it never fails CI or blocks a merge.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, flags"
  behavior: default
  require_changes: true

# Belt and braces on top of the coverlet ExcludeByFile in .runsettings:
# generated code stays out of the coverage denominator.
ignore:
  - "src/Dashboard.Infrastructure/Migrations"
